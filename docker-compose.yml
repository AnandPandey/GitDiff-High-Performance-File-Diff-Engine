services:

  backend:
    build: ./backend
    container_name: gitdiff-backend
    ports:
      - "8000:8000"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build: ./frontend
    container_name: gitdiff-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy